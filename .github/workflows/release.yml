name: Build and Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Так как вы собирали всё вручную и зависимостей в проекте нет,
      # мы просто пропускаем шаг npm install и сразу упаковываем файлы
      - name: Build VSIX Package
        run: |
          npm install -g @vscode/vsce
          vsce package --no-dependencies -o calibra.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: calibra.vsix
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
